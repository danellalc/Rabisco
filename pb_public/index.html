<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#edebe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
<title>Trecos</title>
<meta property="og:title" content="Trecos">
<meta property="og:description" content="Every folder is a board. Keep files, write and organize everything in one light place.">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<section class="login" id="login">
<form class="login-form" id="email-form">
<p class="login-title"><svg class="brand-mark" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M3 15.5c1.8-6 3.6-6 4.7 0s3 6 4.6 0 3-6 4.7 0 2 4.5 4 3"/></svg>Trecos</p>
<p class="login-tagline" data-i18n="tagline">Every folder is a board. Keep files, write and organize everything in one light place.</p>
<p class="login-sub" data-i18n="taglineSub">Sign in with a code sent to your email. No password.</p>
<input class="field" id="email" type="email" required autocomplete="email" placeholder="you@example.com" data-i18n-input="emailPlaceholder">
<p class="login-error" id="email-error" hidden></p>
<button class="primary" type="submit" data-i18n="getCode">Get a code</button>
</form>
<form class="login-form" id="code-form" hidden>
<p class="login-title"><svg class="brand-mark" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M3 15.5c1.8-6 3.6-6 4.7 0s3 6 4.6 0 3-6 4.7 0 2 4.5 4 3"/></svg>Trecos</p>
<p class="login-note" id="code-note"></p>
<input class="field" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="6-digit code" data-i18n-input="codePlaceholder">
<p class="login-error" id="code-error" hidden></p>
<button class="primary" type="submit" data-i18n="signIn">Sign in</button>
<button class="text-link" type="button" id="resend" data-i18n="resend">Resend code</button>
<button class="text-link" type="button" id="change-email" data-i18n="changeEmail">Change email</button>
</form>
</section>
<div class="app" id="app">
<aside class="list" id="list">
<nav class="rail" aria-label="Trecos">
<svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 15.5c1.8-6 3.6-6 4.7 0s3 6 4.6 0 3-6 4.7 0 2 4.5 4 3"/></svg>
<button class="rail-item" id="rail-drive" type="button" aria-current="true" title="My Drive" aria-label="My Drive" data-i18n-title="myDrive" data-i18n-label="myDrive"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M3 19V7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
<button class="rail-item" id="rail-recent" type="button" title="Recent" aria-label="Recent" data-i18n-title="recent" data-i18n-label="recent"><svg width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
<button class="rail-item" id="search-open" type="button" title="Search · Ctrl K" aria-label="Search" data-i18n-title="searchTitle" data-i18n-label="searchAll"><svg width="19" height="19" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20 20"/></svg></button>
<span class="rail-gap"></span>
<button class="rail-item" id="rail-trash" type="button" title="Trash" aria-label="Trash" data-i18n-title="trash" data-i18n-label="trash"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M5 7h14 M9.5 7V5h5v2 M7 7l1 13h8l1-13 M10.5 11v5 M13.5 11v5"/></svg></button>
<button class="avatar" id="avatar" type="button" aria-label="Account" data-i18n-label="account" aria-controls="account-menu"></button>
<div class="menu account-menu" id="account-menu" hidden></div>
</nav>
<div class="panel">
<span class="loading-bar" id="loading-bar" hidden></span>
<section class="panel-view" id="folder-view">
<div class="panel-head" id="folder-head">
<div class="crumb-line" id="crumb-line"><button class="up" id="up" type="button" aria-label="Up one level" data-i18n-label="upLevel">←</button><span class="crumbs" id="crumbs"></span></div>
<p class="panel-title" id="panel-title"></p>
<p class="panel-meta" id="panel-meta"></p>
<div class="panel-actions">
<button class="new-button" id="new" type="button" data-i18n="newMenu" aria-controls="new-menu">+ New</button>
<button class="text-link" id="upload" type="button" data-i18n="uploadShort">Upload files</button>
</div>
<div class="select-bar" id="select-bar" hidden>
<p class="select-line"><span id="select-count"></span><button class="text-link small" id="select-clear" type="button" data-i18n="clearSelection">clear</button></p>
<div class="panel-actions">
<button class="text-link" id="select-share" type="button" data-i18n="share">Share</button>
<button class="text-link" id="select-move" type="button" data-i18n="move">Move</button>
<button class="text-link" id="select-download" type="button" data-i18n="download">Download</button>
<button class="text-link danger" id="select-delete" type="button" data-i18n="delete">Delete</button>
</div>
</div>
</div>
<div class="filter-wrap"><input class="filter" id="search" type="search" placeholder="Filter this folder" aria-label="Filter this folder" data-i18n-input="search" data-i18n-label="search"></div>
<div class="rows" id="rows"></div>
<div class="panel-foot">
<p class="board-line" id="board-line" hidden><span id="board-summary"></span><button class="text-link small" id="fit-link" type="button" data-i18n="fitView">fit view</button></p>
<span class="quota-bar"><span class="quota-fill" id="quota-fill"></span></span>
<span class="quota" id="quota"></span>
</div>
</section>
<div class="menu new-menu" id="new-menu" hidden></div>
<div class="uploads" id="uploads" hidden></div>
<section class="panel-view" id="side-view" hidden>
<div class="panel-head">
<p class="panel-title" id="view-title"></p>
<p class="panel-meta" id="view-sub"></p>
<div class="panel-actions" id="view-actions"></div>
</div>
<div class="rows" id="view-rows"></div>
</section>
</div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="image-input" accept="image/*" multiple hidden>
</aside>
<div class="pane">
<header class="note-header">
<span class="loading-bar" id="board-loading" hidden></span>
<button class="icon-button" id="back" type="button" aria-label="Back" data-i18n-label="back">
<svg class="icon-back" width="20" height="20" viewBox="0 0 24 24"><path d="M20 12H4M11 19l-7-7 7-7"/></svg>
<svg class="icon-sidebar" width="20" height="20" viewBox="0 0 24 24"><path d="M4 5h16v14H4z M9 5v14"/></svg>
</button>
<span class="pane-title" id="pane-title"></span>
<span class="save-state" id="save-state"></span>
<button class="text-button add-button" id="add" type="button" data-i18n="addMenu" aria-controls="add-menu">+ Add</button>
<button class="text-button" id="share" type="button" data-i18n="share" aria-controls="share-panel">Share</button>
<button class="icon-button more-button" id="menu" type="button" aria-label="More" data-i18n-label="more" aria-controls="menu-panel">⋯</button>
<div class="menu" id="add-menu" hidden></div>
<div class="menu" id="share-panel" hidden></div>
<div class="menu" id="menu-panel" hidden></div>
</header>
<main class="board" id="board" data-editable="false" data-tool="select">
<div class="layer" id="layer"></div>
<div class="lasso" id="lasso" hidden></div>
<div class="guide guide-x" id="guide-x" hidden></div>
<div class="guide guide-y" id="guide-y" hidden></div>
<p class="board-message" id="board-message" hidden></p>
<div class="image-selection" id="image-selection" hidden>
<div class="resize-handle" id="resize-handle"></div>
</div>
<div class="drop-marker" id="drop-marker" hidden></div>
<div class="tips" id="tips" hidden>
<p data-i18n="tip1"></p>
<p data-i18n="tip2"></p>
<p data-i18n="tip3"></p>
<button class="text-link" type="button" id="tips-done" data-i18n="gotIt">Got it</button>
</div>
<section class="doc" id="doc" hidden>
<div class="doc-page">
<div class="doc-top">
<button class="text-link" id="doc-close" type="button" data-i18n="backToBoard">Back to board</button>
</div>
<input class="doc-name" id="doc-name" type="text" placeholder="Document name" aria-label="Document name" data-i18n-input="docNamePlaceholder" data-i18n-label="docNamePlaceholder">
<div class="note doc-note" id="doc-note" data-placeholder="Write" data-i18n-placeholder="placeholder"></div>
</div>
</section>
<div class="toolbar" id="toolbar" hidden>
<button type="button" data-cmd="bold" aria-label="Bold" data-i18n-label="bold"><b>B</b></button>
<button type="button" data-cmd="italic" aria-label="Italic" data-i18n-label="italic"><i>I</i></button>
<button type="button" data-cmd="underline" aria-label="Underline" data-i18n-label="underline"><u>U</u></button>
<button type="button" data-cmd="strike" aria-label="Strikethrough" data-i18n-label="strike"><s>S</s></button>
<span class="sep"></span>
<button type="button" class="small" data-cmd="heading1" aria-label="Heading 1" data-i18n-label="heading1">H1</button>
<button type="button" class="small" data-cmd="heading2" aria-label="Heading 2" data-i18n-label="heading2">H2</button>
<button type="button" class="small" data-cmd="quote" aria-label="Quote" data-i18n-label="quote">❝</button>
<button type="button" class="small" data-cmd="code" aria-label="Inline code" data-i18n-label="code">&lt;/&gt;</button>
<button type="button" class="small" data-cmd="codeBlock" aria-label="Code block" data-i18n-label="codeBlock">{ }</button>
<span class="sep"></span>
<button type="button" data-cmd="bulletList" aria-label="Bullet list" data-i18n-label="bulletList"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01M9 6h11M9 12h11M9 18h11"/></svg></button>
<button type="button" data-cmd="numberedList" aria-label="Numbered list" data-i18n-label="numberedList"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.6 5.3L5.6 3.9V8.1M4.3 9.9H6.6L4.3 14.1H6.6M4.3 16H6.6L4.3 18H6.6L4.3 20H6.6M9 6h11M9 12h11M9 18h11"/></svg></button>
<button type="button" data-cmd="checklist" aria-label="Checklist" data-i18n-label="checklist"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 5.5h9v9h-9z M7 10.2l1.7 1.7L13 8.3"/></svg></button>
<span class="sep"></span>
<button type="button" data-cmd="hl1" aria-label="Yellow highlight" data-i18n-label="hl1"><span class="dot hl1"></span></button>
<button type="button" data-cmd="hl2" aria-label="Green highlight" data-i18n-label="hl2"><span class="dot hl2"></span></button>
<button type="button" data-cmd="hl3" aria-label="Pink highlight" data-i18n-label="hl3"><span class="dot hl3"></span></button>
<button type="button" class="small" data-cmd="hlNone" aria-label="Remove highlight" data-i18n-label="hlNone">×</button>
<span class="sep"></span>
<button type="button" data-cmd="c1" aria-label="Red text" data-i18n-label="c1"><span class="dot c1"></span></button>
<button type="button" data-cmd="c2" aria-label="Blue text" data-i18n-label="c2"><span class="dot c2"></span></button>
<button type="button" data-cmd="c3" aria-label="Gray text" data-i18n-label="c3"><span class="dot c3"></span></button>
<button type="button" data-cmd="cDefault" aria-label="Default color" data-i18n-label="cDefault"><span class="dot fg"></span></button>
<span class="sep"></span>
<button type="button" data-cmd="clear" aria-label="Clear formatting" data-i18n-label="clear"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 4L3 18M8 4l5 14M5.2 13h6.4M4 20L20 4"/></svg></button>
</div>
<div class="tools" id="tools">
<button type="button" data-tool="select" aria-pressed="true" title="Select · V" aria-label="Select" data-i18n-title="toolSelectTitle" data-i18n-label="toolSelect"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5.5 3.5l14 8-6 1.5-3.5 5.5Z"/></svg></button>
<button type="button" data-tool="hand" aria-pressed="false" title="Hand · H" aria-label="Hand" data-i18n-title="toolHandTitle" data-i18n-label="toolHand"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11 M11 10.5V4.5a1.5 1.5 0 0 1 3 0V11 M14 11V6a1.5 1.5 0 0 1 3 0v8.5a5.5 5.5 0 0 1-11 0V13 M8 12l-1.8-2.2a1.5 1.5 0 0 0-2.4 1.8L6.5 16"/></svg></button>
<button type="button" data-tool="text" aria-pressed="false" title="Text · T" aria-label="Text" data-i18n-title="toolTextTitle" data-i18n-label="toolText"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 6.5V5h14v1.5 M12 5v14 M9.5 19h5"/></svg></button>
<button type="button" data-tool="note" aria-pressed="false" title="Sticky note · N" aria-label="Sticky note" data-i18n-title="toolNoteTitle" data-i18n-label="toolNote"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 5h14v9l-5 5H5Z M14 19v-5h5"/></svg></button>
<button type="button" data-tool="frame" aria-pressed="false" title="Frame · F" aria-label="Frame" data-i18n-title="toolFrameTitle" data-i18n-label="toolFrame"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 3v18 M17 3v18 M3 7h18 M3 17h18"/></svg></button>
</div>
<div class="zoom" id="zoom">
<button type="button" id="zoom-out" aria-label="Zoom out" data-i18n-label="zoomOut">−</button>
<span id="zoom-level">100%</span>
<button type="button" id="zoom-in" aria-label="Zoom in" data-i18n-label="zoomIn">+</button>
<button type="button" id="fit" aria-label="Fit all" data-i18n-label="fit"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/></svg></button>
</div>
<div class="menu slash-menu" id="slash-menu" hidden></div>
</main>
<section class="download-page" id="download-page" hidden>
<span class="download-icon"><svg viewBox="0 0 32 32" width="64" height="64"><path d=""/></svg><span class="ext" id="download-ext"></span></span>
<div>
<p class="download-name" id="download-name"></p>
<p class="download-size" id="download-size"></p>
</div>
<p class="download-warning" data-i18n="fileWarning">File uploaded by someone else. Only download it if you trust the sender.</p>
<button class="primary" type="button" id="download-button" data-i18n="download">Download</button>
</section>
<footer class="shared-foot" id="shared-foot" hidden>
<span data-i18n="madeWith">Made with Trecos</span>
<a href="/" data-i18n="createYours">Create your own board</a>
<button class="text-link" id="duplicate" type="button" data-i18n="duplicate">Duplicate</button>
</footer>
</div>
</div>
<div class="menu palette" id="palette" hidden>
<input class="palette-input" id="palette-input" type="search" placeholder="Search everything" aria-label="Search everything" data-i18n-input="searchEverything" data-i18n-label="searchEverything">
<div class="palette-rows" id="palette-rows"></div>
</div>
<div class="menu picker" id="picker" hidden></div>
<div class="menu item-menu" id="item-menu" hidden></div>
<div class="menu help" id="help" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="chooser" id="paste-choice" hidden></div>
<dialog class="lightbox" id="lightbox">
<img alt="">
<button type="button" class="lightbox-download" data-i18n="download">Download</button>
</dialog>
</body>
</html>
