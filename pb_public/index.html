<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rabisco</title>
<meta property="og:title" content="Rabisco">
<meta property="og:description" content="Uma nota compartilhada com você · A note shared with you">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<section class="login" id="login">
<form class="login-form" id="email-form">
<p class="login-title">Rabisco</p>
<input class="field" id="email" type="email" required autocomplete="email" placeholder="you@example.com" data-i18n-input="emailPlaceholder">
<p class="login-error" id="email-error" hidden></p>
<button class="primary" type="submit" data-i18n="getCode">Get a code</button>
</form>
<form class="login-form" id="code-form" hidden>
<p class="login-title">Rabisco</p>
<p class="login-note" id="code-note"></p>
<input class="field" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="6-digit code" data-i18n-input="codePlaceholder">
<p class="login-error" id="code-error" hidden></p>
<button class="primary" type="submit" data-i18n="signIn">Sign in</button>
<button class="text-link" type="button" id="resend" data-i18n="resend">Resend code</button>
<button class="text-link" type="button" id="change-email" data-i18n="changeEmail">Change email</button>
</form>
</section>
<div class="app" id="app">
<aside class="list" id="list">
<div class="list-top">
<input class="search" id="search" type="search" placeholder="Search" aria-label="Search" data-i18n-input="search" data-i18n-label="search">
<button class="new" id="new" type="button" aria-label="New note" data-i18n-label="newNote">+</button>
</div>
<div class="rows" id="rows"></div>
<div class="list-foot">
<span class="meta" id="me"></span>
<button class="text-link" id="sign-out" type="button" data-i18n="signOut">Sign out</button>
</div>
</aside>
<div class="pane">
<header class="note-header">
<button class="icon-button" id="back" type="button" aria-label="Back" data-i18n-label="back">
<svg class="icon-back" width="20" height="20" viewBox="0 0 24 24"><path d="M20 12H4M11 19l-7-7 7-7"/></svg>
<svg class="icon-sidebar" width="20" height="20" viewBox="0 0 24 24"><path d="M4 5h16v14H4z M9 5v14"/></svg>
</button>
<span class="save-state" id="save-state"></span>
<button class="text-button" id="share" type="button" data-i18n="share" aria-controls="share-panel">Share</button>
<button class="icon-button more" id="menu" type="button" aria-label="More" data-i18n-label="more" aria-controls="menu-panel">⋯</button>
<div class="menu" id="share-panel" hidden></div>
<div class="menu" id="menu-panel" hidden></div>
</header>
<main class="note-area" id="note-area">
<div class="note" id="note" contenteditable="true" data-placeholder="Write" data-i18n-placeholder="placeholder"></div>
<div class="image-selection" id="image-selection" hidden>
<div class="resize-handle" id="resize-handle"></div>
</div>
<div class="drop-marker" id="drop-marker" hidden></div>
<div class="toolbar" id="toolbar" hidden>
<button type="button" data-cmd="bold" aria-label="Bold" data-i18n-label="bold"><b>B</b></button>
<button type="button" data-cmd="italic" aria-label="Italic" data-i18n-label="italic"><i>I</i></button>
<button type="button" data-cmd="underline" aria-label="Underline" data-i18n-label="underline"><u>U</u></button>
<button type="button" data-cmd="strike" aria-label="Strikethrough" data-i18n-label="strike"><s>S</s></button>
<span class="sep"></span>
<button type="button" class="small" data-cmd="heading1" aria-label="Heading 1" data-i18n-label="heading1">H1</button>
<button type="button" class="small" data-cmd="heading2" aria-label="Heading 2" data-i18n-label="heading2">H2</button>
<span class="sep"></span>
<button type="button" data-cmd="bulletList" aria-label="Bullet list" data-i18n-label="bulletList"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01M9 6h11M9 12h11M9 18h11"/></svg></button>
<button type="button" data-cmd="numberedList" aria-label="Numbered list" data-i18n-label="numberedList"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.6 5.3L5.6 3.9V8.1M4.3 9.9H6.6L4.3 14.1H6.6M4.3 16H6.6L4.3 18H6.6L4.3 20H6.6M9 6h11M9 12h11M9 18h11"/></svg></button>
<button type="button" data-cmd="checklist" aria-label="Checklist" data-i18n-label="checklist"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 5.5h9v9h-9z M7 10.2l1.7 1.7L13 8.3"/></svg></button>
<span class="sep"></span>
<button type="button" data-cmd="hl1" aria-label="Yellow highlight" data-i18n-label="hl1"><span class="dot hl1"></span></button>
<button type="button" data-cmd="hl2" aria-label="Green highlight" data-i18n-label="hl2"><span class="dot hl2"></span></button>
<button type="button" data-cmd="hl3" aria-label="Pink highlight" data-i18n-label="hl3"><span class="dot hl3"></span></button>
<button type="button" class="small" data-cmd="hlNone" aria-label="Remove highlight" data-i18n-label="hlNone">×</button>
<span class="sep"></span>
<button type="button" data-cmd="c1" aria-label="Red text" data-i18n-label="c1"><span class="dot c1"></span></button>
<button type="button" data-cmd="c2" aria-label="Blue text" data-i18n-label="c2"><span class="dot c2"></span></button>
<button type="button" data-cmd="c3" aria-label="Gray text" data-i18n-label="c3"><span class="dot c3"></span></button>
<button type="button" data-cmd="cDefault" aria-label="Default color" data-i18n-label="cDefault"><span class="dot fg"></span></button>
<span class="sep"></span>
<button type="button" data-cmd="clear" aria-label="Clear formatting" data-i18n-label="clear"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 4L3 18M8 4l5 14M5.2 13h6.4M4 20L20 4"/></svg></button>
</div>
</main>
<footer class="shared-foot" id="shared-foot" hidden>
<span data-i18n="madeWith">Made with Rabisco</span>
<a href="/" data-i18n="createYours">Create your note</a>
<button class="text-link" id="duplicate" type="button" data-i18n="duplicate">Duplicate</button>
</footer>
</div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chooser" id="paste-choice" hidden></div>
<dialog class="lightbox" id="lightbox">
<img alt="">
<button type="button" class="lightbox-download" data-i18n="download">Download</button>
</dialog>
</body>
</html>
