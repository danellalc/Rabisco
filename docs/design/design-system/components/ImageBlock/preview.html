<!-- @dsCard group="Editor" height=320 subtitle="Normal, selecionada com alça, e subindo" -->
<style>
  .rb-wrap { font-family:var(--font-sans, system-ui, sans-serif); color:var(--fg); display:flex; gap:var(--space-24); flex-wrap:wrap; }
  .rb-col { display:flex; flex-direction:column; gap:var(--space-8); }
  .rb-label { color:var(--fg2); text-transform:uppercase; margin:0; }
  .rb-img { width:200px; height:130px; background:var(--line); display:flex; align-items:center; justify-content:center; color:var(--fg2); position:relative; }
  .rb-img.up { opacity:0.5; }
  .rb-img.sel { outline:2px solid var(--acc); outline-offset:2px; }
  .rb-handle { position:absolute; right:-2px; bottom:-2px; width:32px; height:32px; display:flex; align-items:flex-end; justify-content:flex-end; }
  .rb-handle span { width:12px; height:12px; background:var(--bg); border:1.75px solid var(--acc); }
</style>
<div class="rb-wrap">
  <div class="rb-col">
    <p class="rb-label meta">Normal</p>
    <div class="rb-img"><span class="meta">foto</span></div>
  </div>
  <div class="rb-col">
    <p class="rb-label meta">Selecionada</p>
    <div class="rb-img sel"><span class="meta">foto</span><span class="rb-handle"><span></span></span></div>
  </div>
  <div class="rb-col">
    <p class="rb-label meta">Subindo</p>
    <div class="rb-img up"><span class="meta">foto</span></div>
  </div>
</div>
